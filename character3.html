<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>众星之环 · 个人志</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/haloblade.css">
</head>
<body class="novel" data-character="scatteredStars">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark"><i class="fas fa-dragon"></i></span>
                <span class="brand-text">众星之环<span class="brand-sub">HALOBLADEGAME</span></span>
            </a>
            <nav class="nav-links" id="nav-links">
                <a href="HTMLPage1.html" data-nav="HTMLPage1.html">首页</a>
                <a href="chapter1.html" data-nav="chapter1.html">正文</a>
                <a href="premise.html" data-nav="premise.html">设定</a>
                <a href="character1.html" data-nav="character1.html">人物</a>
                <a href="chapter3.html" data-nav="chapter3.html">短篇</a>
                <a href="HTMLPage2.html" class="nav-cta">前往战棋</a>
            </nav>
            <div class="nav-actions">
                <button class="nav-icon" data-theme-toggle title="切换昼夜"><i class="fas fa-moon"></i></button>
                <button class="nav-burger" id="nav-burger" aria-label="菜单"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="character-layout">
            <div class="bookmark-rail" id="bookmarkRail"></div>
            <div class="character-showcase">
                <div class="character-card-flip" id="imageCard">
                    <div class="card-face front" id="cardFront"><img id="mainImage" src="" alt="角色"></div>
                    <div class="card-face back" id="cardBack"><img id="backImage" src="" alt="角色"></div>
                </div>
                <p class="character-intro" id="introText"></p>
            </div>
            <div class="tag-panel" id="tagPanel"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <span>© 2023 《众星之环》官方小说站. 保留所有权利。</span>
                <span><i class="fas fa-dragon" style="color: var(--gold-2);"></i> HALOBLADEGAME</span>
            </div>
        </div>
    </footer>

    <script src="./js/data.js"></script>
    <script src="./js/haloblade.js"></script>
    <script>
        (function () {
            var key = document.body.getAttribute('data-character');
            var data = HB_DATA.characters[key];
            if (!data) return;

            document.title = data.title + ' · ' + data.tags[0].label;
            document.getElementById('introText').textContent = data.tagline;

            var rail = document.getElementById('bookmarkRail');
            data.bookmarks.forEach(function (item) {
                var bm = document.createElement('div');
                bm.className = 'big-bookmark';
                if (item.bg) bm.style.backgroundImage = "url('" + item.bg + "')";
                bm.innerHTML = '<span class="bookmark-label">' + HB.util.escapeHtml(item.label) + '</span>';
                bm.addEventListener('click', function () {
                    var overlay = document.createElement('div');
                    overlay.className = 'fullscreen-flip';
                    document.body.appendChild(overlay);
                    overlay.addEventListener('animationend', function () {
                        overlay.remove();
                        window.location.href = item.url;
                    });
                });
                rail.appendChild(bm);
            });

            var mainImage = document.getElementById('mainImage');
            var backImage = document.getElementById('backImage');
            var introText = document.getElementById('introText');
            var card = document.getElementById('imageCard');
            var panel = document.getElementById('tagPanel');
            var currentIndex = 0;

            function setContent(index, instant) {
                var t = data.tags[index];
                var img = new Image();
                img.onload = function () {
                    if (instant) {
                        mainImage.src = t.img;
                        backImage.src = t.img;
                    } else {
                        backImage.src = t.img;
                        card.classList.add('flipping');
                        card.addEventListener('animationend', function handler() {
                            card.classList.remove('flipping');
                            mainImage.src = t.img;
                            card.removeEventListener('animationend', handler);
                        });
                    }
                    introText.textContent = t.text;
                };
                if (img.complete) { img.onload(); }
                img.src = t.img;
                HB.util.$$('.small-tag', panel).forEach(function (el, i) { el.classList.toggle('active', i === index); });
            }

            data.tags.forEach(function (t, i) {
                var tag = document.createElement('div');
                tag.className = 'small-tag' + (i === 0 ? ' active' : '');
                tag.textContent = t.label;
                tag.addEventListener('click', function () {
                    if (currentIndex === i) return;
                    currentIndex = i;
                    setContent(i, false);
                });
                panel.appendChild(tag);
            });

            setContent(0, true);
        })();
    </script>
</body>
</html>
