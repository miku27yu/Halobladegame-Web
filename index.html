<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halobladegame · 众星之环</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/haloblade.css">
</head>
<body>
    <div class="portal" style="background-image: url('./picture/main4.png')">
        <!-- 顶部栏 -->
        <div class="portal-top">
            <div class="portal-title">
                <i class="fas fa-dragon"></i>
                <span>HALOBLADEGAME</span>
            </div>
            <button class="btn btn-ghost btn-sm" id="login-btn">
                <i class="fas fa-user"></i> 登录
            </button>
        </div>

        <!-- 中央标题 -->
        <div class="portal-center">
            <span class="eyebrow" style="color:#e8c96a;">EPIC FANTASY · STRATEGY</span>
            <h1><span class="gold-gradient">众星之环</span></h1>
            <p>一部交织着奇幻与科幻的文学艺术世界——深入《众星之环》小说宇宙，或踏入史诗级战棋桌游的无限博弈。</p>
        </div>

        <!-- 左上/右下斜线二分：整侧为一个按钮，悬停扩张并挤压另一侧 -->
        <div class="portal-split" id="portal-split">
            <div class="split-pane split-left" id="split-left"><!-- 人物虚影由 JS 生成 --></div>
            <div class="split-pane split-right" id="split-right"><!-- 剑刃与投影由 JS 生成 --></div>

            <div class="split-content split-content-left">
                <i class="fas fa-book-open"></i>
                <h2>进入小说官网</h2>
                <p>探索众星之环小说世界，深入源流与剑的故事与传说。</p>
                <span class="split-cta">开始阅读 <i class="fas fa-arrow-right"></i></span>
            </div>
            <div class="split-content split-content-right">
                <i class="fas fa-chess-knight"></i>
                <h2>前往战棋官网</h2>
                <p>体验战棋世界的无限博弈，发现 Halobladegame 全新系列包。</p>
                <span class="split-cta">立即探索 <i class="fas fa-arrow-right"></i></span>
            </div>
        </div>

        <div class="portal-footnote">
            Halobladegame 融合奇幻与科幻元素，包含《众星之环》小说本体及史诗级策略战棋桌游，共同提供沉浸式的战斗体验与丰富剧情。
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <button class="modal-close" data-modal-close>&times;</button>
            <h3 class="modal-title">用户登录</h3>
            <form id="login-form">
                <div style="margin-bottom: 16px;">
                    <label for="username" style="display:block; font-size:14px; margin-bottom:6px;">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required
                        style="width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); color:var(--ink); font-size:14px; outline:none;">
                </div>
                <div style="margin-bottom: 18px;">
                    <label for="password" style="display:block; font-size:14px; margin-bottom:6px;">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required
                        style="width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); color:var(--ink); font-size:14px; outline:none;">
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-right-to-bracket"></i> 登录</button>
                <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--ink-soft);">
                    <a href="#" style="color:var(--primary-2); text-decoration:none;">忘记密码?</a> ·
                    <a href="#" style="color:var(--primary-2); text-decoration:none;">注册账号</a>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/haloblade.js"></script>
    <script>
        (function () {
            /* ---- 登录 ---- */
            var loginBtn = document.getElementById('login-btn');
            var loginForm = document.getElementById('login-form');
            loginBtn.addEventListener('click', function () { HB.openModal('login-modal'); });
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value.trim();
                if (username && password) {
                    HB.toast.success('欢迎回来，' + username + '！');
                    HB.closeModal('login-modal');
                    loginBtn.innerHTML = '<i class="fas fa-user"></i> ' + username;
                } else {
                    HB.toast.error('请输入用户名和密码！');
                }
            });

            /* ---- 斜线二分：悬停扩张 + 点击导航 ---- */
            var split = document.getElementById('portal-split');
            var LEFT_URL = './HTMLPage1.html';
            var RIGHT_URL = './HTMLPage2.html';
            var isMobile = window.matchMedia('(max-width: 768px)').matches;

            function sideOf(e) {
                var rect = split.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                if (isMobile) {
                    /* 移动端：上半=小说，下半=战棋 */
                    return y < rect.height / 2;
                }
                /* 反斜对角线（右上→左下）：x/W + y/H < 1 视为左上侧 */
                return (x / rect.width + y / rect.height) < 1;
            }

            if (split) {
                if (!isMobile) {
                    split.addEventListener('mousemove', function (e) {
                        var left = sideOf(e);
                        split.classList.toggle('left-hover', left);
                        split.classList.toggle('right-hover', !left);
                    });
                    split.addEventListener('mouseleave', function () {
                        split.classList.remove('left-hover', 'right-hover');
                    });
                }
                split.addEventListener('click', function (e) {
                    window.location.href = sideOf(e) ? LEFT_URL : RIGHT_URL;
                });
            }

            /* ---- 两侧装饰：图片本体 + 同位置黑灰影子（同一动画不同速度 = 差速立体） ---- */
            function buildUnits(pane, items, shapeClass) {
                items.forEach(function (it) {
                    var unit = document.createElement('div');
                    unit.className = 'fx-unit ' + shapeClass;
                    if (it.top !== undefined) unit.style.top = it.top;
                    if (it.left !== undefined) unit.style.left = it.left;
                    if (it.bottom !== undefined) unit.style.bottom = it.bottom;
                    if (it.right !== undefined) unit.style.right = it.right;
                    unit.style.width = (typeof it.w === 'number') ? it.w + 'px' : it.w;
                    unit.style.height = (typeof it.h === 'number') ? it.h + 'px' : it.h;
                    unit.style.transitionDelay = it.delay + 's';
                    if (it.rot) unit.style.setProperty('--rot', it.rot);

                    var shadow = document.createElement('div');
                    shadow.className = 'fx-shadow-fig';
                    shadow.style.backgroundImage = "url('" + it.img + "')";
                    unit.appendChild(shadow);

                    var body = document.createElement('div');
                    body.className = 'fx-fig ' + it.cls;
                    body.style.backgroundImage = "url('" + it.img + "')";
                    unit.appendChild(body);

                    pane.appendChild(unit);
                });
            }

            var leftPane = document.getElementById('split-left');
            if (leftPane) {
                buildUnits(leftPane, [
                    { img: './picture/c7.jpg',  cls: 'portrait',       top: '3%',   left: '0%',    w: '5.2vw', h: '5.2vw', rot: '-12deg', delay: 0.05 },
                    { img: './picture/c5.jpg',  cls: 'portrait',       top: '16%',  left: '0.5%',  w: '6vw',   h: '6vw',   rot: '-15deg', delay: 0.15 },
                    { img: './picture/c4.jpg',  cls: 'portrait',       top: '0%',   left: '6%',    w: '6.4vw', h: '6.4vw', rot: '-4deg',  delay: 0.25 },
                    { img: './picture/c3.jpg',  cls: 'portrait',       top: '15%',  left: '19%',   w: '6vw',   h: '6vw',   rot: '10deg',  delay: 0.35 },
                    { img: './picture/c2.jpg',  cls: 'portrait',       top: '0.5%', left: '22%',   w: '6vw',   h: '6vw',   rot: '5deg',   delay: 0.45 },
                    { img: './picture/c6.jpg',  cls: 'portrait',       top: '9%',   left: '27.5%', w: '5.4vw', h: '5.4vw', rot: '14deg',  delay: 0.55 },
                    { img: './picture/c1.jpg',  cls: 'portrait-front', top: '5.5%', left: '12%',   w: '7.6vw', h: '7.6vw', rot: '-3deg',  delay: 0.65 }
                ], 'fx-unit-portrait');
            }

            var rightPane = document.getElementById('split-right');
            if (rightPane) {
                buildUnits(rightPane, [
                    { img: './picture/christopher-romion.jpg', cls: 'card-front', bottom: '6%',  right: '12%', w: 140, h: 150, rot: '3deg',   delay: 0.05 },
                    { img: './picture/chosen-blood.jpg',      cls: 'card',       bottom: '4%',  right: '24%', w: 104, h: 130, rot: '-10deg', delay: 0.15 },
                    { img: './picture/land-cannon.jpg',       cls: 'card',       bottom: '12%', right: '3%',  w: 118, h: 130, rot: '8deg',   delay: 0.25 },
                    { img: './picture/wings-nights.jpg',      cls: 'card',       bottom: '1%',  right: '33%', w: 84,  h: 112, rot: '-17deg', delay: 0.35 },
                    { img: './picture/storm-bringers.jpg',    cls: 'card',       bottom: '17%', right: '15%', w: 92,  h: 118, rot: '13deg',  delay: 0.45 },
                    { img: './picture/tactical-advancer.jpg', cls: 'card',       bottom: '9%',  right: '-5%', w: 110, h: 130, rot: '-7deg',  delay: 0.55 },
                    { img: './picture/dyxz.jpg',              cls: 'card',       bottom: '-9%', right: '26%', w: 86,  h: 110, rot: '18deg',  delay: 0.65 }
                ], 'fx-unit-card');

                var gleams = [
                    { bottom: '3%',  right: '24%', w: 160, rot: '26deg',  delay: 0.7 },
                    { bottom: '14%', right: '1%',  w: 130, rot: '-30deg', delay: 0.9 },
                    { bottom: '22%', right: '10%', w: 140, rot: '10deg',  delay: 1.1 },
                    { bottom: '9%',  right: '33%', w: 100, rot: '-12deg', delay: 1.3 }
                ];
                gleams.forEach(function (g) {
                    var el = document.createElement('div');
                    el.className = 'fx-gleam';
                    el.style.bottom = g.bottom;
                    el.style.right = g.right;
                    el.style.width = g.w + 'px';
                    el.style.transform = 'rotate(' + g.rot + ')';
                    el.style.animationDelay = g.delay + 's';
                    rightPane.appendChild(el);
                });
            }
        })();
    </script>
</body>
</html>
